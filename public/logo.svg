<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" shape-rendering="crispEdges">
  <!-- Electric Yellow background -->
  <rect width="64" height="64" fill="#FFE500"/>

  <!-- 3D Drop Shadow (offset 4px right, 4px down) -->
  <path d="M12,20 L12,56 L52,56 L52,16 L56,16 L56,60 L16,60 Z" fill="#362486" opacity="0.35"/>

  <!-- Folder back panel (Deep Indigo outline) -->
  <rect x="8" y="12" width="44" height="40" rx="0" fill="#362486"/>

  <!-- Folder body fill (Electric Yellow) -->
  <rect x="10" y="24" width="40" height="26" fill="#FFE500"/>

  <!-- Folder tab shape (yellow tab on back panel) -->
  <polygon points="10,14 10,22 26,22 30,14" fill="#FFE500"/>

  <!-- Folder front flap (indigo crease line) -->
  <rect x="10" y="22" width="40" height="4" fill="#362486"/>

  <!-- Document page peeking out (yellow with indigo border) -->
  <rect x="28" y="14" width="20" height="10" fill="#362486"/>
  <rect x="30" y="16" width="16" height="6" fill="#FFE500"/>

  <!-- Document text lines (indigo) -->
  <rect x="32" y="17" width="10" height="1.5" fill="#362486"/>
  <rect x="32" y="20" width="8" height="1.5" fill="#362486"/>

  <!-- Folder body inner area (yellow) -->
  <rect x="10" y="26" width="40" height="24" fill="#FFE500"/>

  <!-- Bottom edge & right edge (indigo border) -->
  <rect x="8" y="50" width="44" height="2" fill="#362486"/>
  <rect x="50" y="14" width="2" height="38" fill="#362486"/>
  <rect x="8" y="14" width="2" height="38" fill="#362486"/>

  <!-- Pixel corner details for OG retro feel -->
  <!-- Top-left corner notch -->
  <rect x="8" y="12" width="4" height="2" fill="#362486"/>
  <!-- Top-right corner -->  
  <rect x="48" y="12" width="4" height="2" fill="#362486"/>
</svg>